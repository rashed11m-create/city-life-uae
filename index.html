<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CITY LIFE UAE - DUBAI</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#9bc9e8;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:2}
.box{background:#101923dd;padding:11px 14px;border-radius:12px;color:white;font-size:13px}
#logo{font-size:18px;color:#f4c45e;font-weight:bold}
#speed{font-size:25px;font-weight:bold}
#controls{position:fixed;bottom:20px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;z-index:2}
#stick{width:120px;height:120px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff99;position:relative;touch-action:none}
#knob{position:absolute;width:50px;height:50px;left:33px;top:33px;border-radius:50%;background:white}
.pedals{display:flex;gap:10px}
button{width:72px;height:72px;border-radius:50%;border:2px solid white;color:white;font-weight:bold;background:#172b43dd;touch-action:none}
#gas{background:#159b59}
#brake{background:#bd3030}
#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#101923ed;color:white;padding:17px 20px;border-radius:12px;z-index:5;text-align:center;max-width:85%;line-height:1.7}
</style>
</head>
<body>

<div id="status">جاري تحميل خريطة دبي...<br>يرجى الانتظار</div>

<div id="hud">
 <div class="box">
  <div id="logo">CITY LIFE UAE</div>
  <div>DOWNTOWN DUBAI</div>
  <div>💰 AED 5,000</div>
 </div>
 <div class="box" style="text-align:center">
  <div id="speed">0</div>
  <div>KM/H</div>
 </div>
</div>

<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <div class="pedals">
  <button id="brake">فرامل</button>
  <button id="gas">بنزين</button>
 </div>
</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.185.0';

const status = document.getElementById('status');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc9e8);
scene.fog = new THREE.Fog(0x9bc9e8,500,2500);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,5000);

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe5f3ff,0x6b6658,2));

const sun = new THREE.DirectionalLight(0xffedcf,2.5);
sun.position.set(-500,900,500);
sun.castShadow = true;
scene.add(sun);

function material(color,roughness=.8,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

const centerLat = 25.1972;
const centerLon = 55.2744;
const cosLat = Math.cos(centerLat*Math.PI/180);

function positionFromGPS(lat,lon){
 return new THREE.Vector3(
  (lon-centerLon)*111320*cosLat,
  0,
  -(lat-centerLat)*111320
 );
}

// الأرض
const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(4000,4000),
 material(0xc6b99d)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.15;
scene.add(ground);

// طرق الخريطة
function addRoad(a,b,width=7){
 const dx=b.x-a.x;
 const dz=b.z-a.z;
 const length=Math.hypot(dx,dz);
 if(length<.1)return;

 const road=new THREE.Mesh(
  new THREE.BoxGeometry(width,.12,length),
  material(0x30343a)
 );
 road.position.set((a.x+b.x)/2,.01,(a.z+b.z)/2);
 road.rotation.y=Math.atan2(dx,dz);
 scene.add(road);
}

// المباني من بيانات الخريطة
function addBuilding(points,tags={}){
 if(points.length<3)return;

 const shape=new THREE.Shape();
 shape.moveTo(points[0].x,points[0].z);

 for(let i=1;i<points.length;i++){
  shape.lineTo(points[i].x,points[i].z);
 }

 shape.closePath();

 const height=Number(tags.height) ||
  (Number(tags['building:levels']) ? Number(tags['building:levels'])*3.2 : 12+Math.random()*30);

 const geometry=new THREE.ExtrudeGeometry(shape,{
  depth:height,
  bevelEnabled:false
 });

 // تحويل اتجاه المجسم إلى الأعلى
 geometry.rotateX(Math.PI/2);

 const building=new THREE.Mesh(
  geometry,
  material(0xb7b6b0,.65,.12)
 );

 building.position.y=0;
 building.castShadow=true;
 building.receiveShadow=true;
 scene.add(building);
}

// تحميل بيانات OpenStreetMap
async function loadDubaiMap(){
 const south=25.181;
 const west=55.260;
 const north=25.210;
 const east=55.292;

 const query=`
 [out:json][timeout:45];
 (
  way["highway"](${south},${west},${north},${east});
  way["building"](${south},${west},${north},${east});
 );
 out body;
 >;
 out skel qt;
 `;

 const endpoints=[
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter'
 ];

 let data=null;

 for(const url of endpoints){
  try{
   const response=await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'data='+encodeURIComponent(query)
   });

   if(!response.ok)throw new Error('Map server error');
   data=await response.json();
   break;
  }catch(e){
   console.warn('Map server failed:',url,e);
  }
 }

 if(!data)throw new Error('تعذر الاتصال بخدمة الخريطة');

 const nodes=new Map();
 const ways=[];

 for(const item of data.elements){
  if(item.type==='node'){
   nodes.set(item.id,positionFromGPS(item.lat,item.lon));
  }
  if(item.type==='way')ways.push(item);
 }

 let roads=0;
 let buildings=0;

 for(const way of ways){
  const points=way.nodes.map(id=>nodes.get(id)).filter(Boolean);
  if(points.length<2)continue;

  if(way.tags && way.tags.highway){
   let width=7;
   const type=way.tags.highway;

   if(type==='motorway'||type==='trunk')width=15;
   else if(type==='primary'||type==='secondary')width=11;
   else if(type==='residential'||type==='service')width=6;

   for(let i=0;i<points.length-1;i++){
    addRoad(points[i],points[i+1],width);
   }
   roads++;
  }

  if(way.tags && way.tags.building && points.length>=3){
   addBuilding(points,way.tags);
   buildings++;
  }
 }

 return {roads,buildings};
}

// معالم دبي
function createLandmark(lat,lon,width,height,depth,color){
 const p=positionFromGPS(lat,lon);
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(width,height,depth),
  material(color,.35,.25)
 );
 mesh.position.set(p.x,height/2,p.z);
 mesh.castShadow=true;
 scene.add(mesh);
 return mesh;
}

// برج خليفة - مجسم مبدئي
function createBurj(){
 const p=positionFromGPS(25.1972,55.2744);
 const group=new THREE.Group();

 const levels=[
  [55,40,90],
  [43,34,100],
  [32,27,120],
  [23,20,130],
  [14,13,130],
  [7,7,110]
 ];

 let y=0;

 for(const [w,d,h] of levels){
  const part=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),
   material(0x9bbdcb,.25,.4)
  );
  part.position.y=y+h/2;
  group.add(part);
  y+=h;
 }

 const tip=new THREE.Mesh(
  new THREE.ConeGeometry(3,90,12),
  material(0xc8d8df,.3,.5)
 );
 tip.position.y=y+45;
 group.add(tip);

 group.position.set(p.x,0,p.z);
 scene.add(group);
}

// دبي مول - مجسم مبدئي
function createDubaiMall(){
 const p=positionFromGPS(25.1985,55.2796);
 const mall=new THREE.Mesh(
  new THREE.BoxGeometry(180,14,120),
  material(0xb6a994)
 );
 mall.position.set(p.x,7,p.z);
 mall.castShadow=true;
 scene.add(mall);
}

// نافورة دبي - مجسم مبدئي
function createFountain(){
 const p=positionFromGPS(25.1955,55.275);
 const water=new THREE.Mesh(
  new THREE.CircleGeometry(35,48),
  new THREE.MeshStandardMaterial({
   color:0x319bc4,
   roughness:.2,
   metalness:.3
  })
 );
 water.rotation.x=-Math.PI/2;
 water.position.set(p.x,.1,p.z);
 scene.add(water);
}

createBurj();
createDubaiMall();
createFountain();

// السيارة
const car=new THREE.Group();

const body=new THREE.Mesh(
 new THREE.BoxGeometry(2.2,.8,4.5),
 material(0x111820,.3,.5)
);
body.position.y=.85;
car.add(body);

const cabin=new THREE.Mesh(
 new THREE.BoxGeometry(1.8,.85,2.2),
 material(0x263e50,.2,.4)
);
cabin.position.set(0,1.55,-.2);
car.add(cabin);

const wheels=[];

for(const x of [-1.15,1.15]){
 for(const z of [-1.4,1.4]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(.42,.42,.3,20),
   material(0x111111)
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.48,z);
  car.add(wheel);
  wheels.push(wheel);
 }
}

scene.add(car);

// نبدأ قريب من وسط داون تاون
const start=positionFromGPS(25.196,55.270);
car.position.set(start.x,0,start.z);

// التحكم
let throttle=0,braking=0,steering=0,speed=0,heading=0;

const stick=document.getElementById('stick');
const knob=document.getElementById('knob');
let stickId=null;

stick.addEventListener('pointerdown',e=>{
 stickId=e.pointerId;
 stick.setPointerCapture(e.pointerId);
 moveStick(e);
});

stick.addEventListener('pointermove',e=>{
 if(e.pointerId===stickId)moveStick(e);
});

function moveStick(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const max=40;
 const len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 steering=dx/max;
 knob.style.left=(33+dx)+'px';
 knob.style.top=(33+dy)+'px';
}

function resetStick(){
 stickId=null;
 steering=0;
 knob.style.left='33px';
 knob.style.top='33px';
}

stick.addEventListener('pointerup',resetStick);
stick.addEventListener('pointercancel',resetStick);

function hold(id,callback){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  callback(true);
 });
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{
  el.addEventListener(ev,()=>callback(false));
 });
}

hold('gas',v=>throttle=v?1:0);
hold('brake',v=>braking=v?1:0);

const keys={};

addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// تحميل الخريطة
loadDubaiMap().then(result=>{
 status.innerHTML=
  'تم تحميل خريطة دبي!<br>'+
  'الشوارع: '+result.roads+
  '<br>المباني: '+result.buildings;
 setTimeout(()=>status.style.display='none',2500);
}).catch(error=>{
 console.error(error);
 status.innerHTML=
  'تعذر تحميل بيانات الخريطة.<br>'+
  'تأكد من اتصال الإنترنت وحاول إعادة تحميل الصفحة.';
});

// الكاميرا
let last=performance.now();

function animate(now){
 requestAnimationFrame(animate);

 const dt=Math.min((now-last)/1000,.04);
 last=now;

 const gas=throttle||(keys.w||keys.arrowup?1:0);
 const brake=braking||(keys.s||keys.arrowdown?1:0);

 let steer=steering;

 if(keys.a||keys.arrowleft)steer=-1;
 if(keys.d||keys.arrowright)steer=1;

 if(gas)speed+=13*dt;
 else speed*=Math.pow(.988,dt*60);

 if(brake)speed*=Math.pow(.91,dt*60);

 speed=THREE.MathUtils.clamp(speed,-7,38);

 if(Math.abs(speed)>.15){
  heading-=steer*1.25*dt*Math.sign(speed);
  car.rotation.y=heading;
  car.position.x+=Math.sin(heading)*speed*dt;
  car.position.z+=Math.cos(heading)*speed*dt;
  wheels.forEach(w=>w.rotation.x+=speed*dt);
 }

 const target=new THREE.Vector3(
  car.position.x-Math.sin(heading)*12,
  car.position.y+6,
  car.position.z-Math.cos(heading)*12
 );

 camera.position.lerp(target,1-Math.pow(.001,dt));
 camera.lookAt(car.position.x,car.position.y+1.2,car.position.z);

 document.getElementById('speed').textContent=
  Math.round(Math.abs(speed)*3.6);

 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
