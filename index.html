let walkingMode=false,running=false,nearbyNPC=null,currentNPC=null,playerHeading=0,playerSpeed=0,playerTargetSpeed=0,throttle=0,braking=0,steering=0,stickY=0,speed=0,heading=0,lateral=0;function message(t){status.textContent=t;status.style.display='block';clearTimeout(message.timer);message.timer=setTimeout(()=>status.style.display='none',1700)}function exitCar(){if(!carLoaded||Math.abs(speed)>1)return;walkingMode=true;speed=0;throttle=0;braking=0;player.position.set(car.position.x+Math.cos(heading)*2,0,car.position.z-Math.sin(heading)*2);playerHeading=heading;player.rotation.y=playerHeading;player.visible=true;$('modeText').textContent='وضع المشي';document.querySelector('.pedals').style.display='none';$('runBtn').style.display='block';$('exitBtn').textContent='🚙 ركوب السيارة';$('help').textContent='استخدم العصا للمشي والاتجاهات'}function enterCar(){if(player.position.distanceTo(car.position)>5){message('قرب من السيارة عشان تركب');return}walkingMode=false;running=false;player.visible=false;playerSpeed=0;playerTargetSpeed=0;document.querySelector('.pedals').style.display='flex';$('runBtn').style.display='none';$('talkBtn').style.display='none';$('modeText').textContent='تجربة القيادة';$('exitBtn').textContent='🚶 نزول من السيارة';$('help').textContent='اسحب الشاشة لتدوير الكاميرا'}$('exitBtn').addEventListener('click',()=>walkingMode?enterCar():exitCar());$('runBtn').addEventListener('pointerdown',e=>{e.preventDefault();if(walkingMode)running=true});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>$('runBtn').addEventListener(ev,()=>running=false));
function openChat(npc){if(!npc.dialogue.length){toast('هذا الشخص يتمشى في المنطقة');return}currentNPC=npc;const line=npc.dialogue[npc.message%npc.dialogue.length];$('chatName').textContent='👤 '+npc.name;$('chatText').textContent=line.text;const choices=$('chatChoices');choices.innerHTML='';line.choices.forEach(c=>{const b=document.createElement('button');b.className='chatChoice';b.textContent=c[0];b.onclick=()=>{$('chatText').textContent='أنت: '+c[0]+'\n\n'+npc.name+': '+c[1];choices.innerHTML='';const next=document.createElement('button');next.className='chatChoice';next.textContent='متابعة المحادثة';next.onclick=()=>{npc.message++;talkedTo.add(npc.name);openChat(npc);checkMission()};choices.appendChild(next);talkedTo.add(npc.name);checkMission()};choices.appendChild(b)});chatBox.style.display='block';$('talkBtn').style.display='none'}$('closeChat').onclick=()=>{chatBox.style.display='none';currentNPC=null};$('talkBtn').onclick=()=>{if(nearbyNPC)openChat(nearbyNPC)};
// تعبئة الوقود
function stationDistance(){return car.position.distanceTo(new THREE.Vector3(27,0,570))}$('fuelBtn').onclick=()=>{if(walkingMode)return;if(fuel>=100){toast('خزان الوقود ممتلئ!');return}if(Math.abs(speed)>1){toast('وقف السيارة أول عشان تعبي');return}const price=Math.ceil((100-fuel)*1.5);if(money<price){toast('رصيدك ما يكفي!');return}money-=price;fuel=100;updateMoney();updateFuel();toast('تمت التعبئة في ADNOC ⛽')};
// الكاميرا
let cameraMode=0,cameraAngle=0,cameraHeight=3.2,cameraDistance=8,dragging=false,lastX=0,lastY=0;$('cameraBtn').onclick=()=>{if(walkingMode)return;cameraMode=1-cameraMode;$('cameraBtn').textContent=cameraMode===0?'📷 الكاميرا: خارجية':'📷 الكاميرا: داخلية'};renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});window.addEventListener('pointerup',()=>dragging=false);window.addEventListener('pointermove',e=>{if(!dragging||cameraMode===1||chatBox.style.display==='block')return;cameraAngle-=(e.clientX-lastX)*.006;cameraHeight=THREE.MathUtils.clamp(cameraHeight+(e.clientY-lastY)*.025,1.5,9);lastX=e.clientX;lastY=e.clientY});

const stick=$('stick'),knob=$('knob');let stickId=null;stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e)});function moveStick(e){const r=stick.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=38,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}steering=dx/max;stickY=dy/max;knob.style.left=(31+dx)+'px';knob.style.top=(31+dy)+'px'}function resetStick(){stickId=null;steering=0;stickY=0;knob.style.left='31px';knob.style.top='31px'}stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);function hold(id,cb){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);cb(true)});['pointerup','pointercancel','lostpointercapture'].forEach(v=>el.addEventListener(v,()=>cb(false)))}hold('gas',v=>throttle=v?1:0);hold('brake',v=>braking=v?1:0);const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

const map=$('map'),mctx=map.getContext('2d');function drawMap(){const w=map.width,h=map.height;mctx.clearRect(0,0,w,h);mctx.fillStyle='#263b34';mctx.fillRect(0,0,w,h);mctx.fillStyle='#555b61';mctx.fillRect(112,0,40,h);mctx.fillRect(0,116,w,30);mctx.fillStyle='#ddd';for(let y=0;y<h;y+=28){mctx.fillRect(130,y,4,13)}for(let x=0;x<w;x+=28){mctx.fillRect(x,128,13,4)}mctx.fillStyle='#087b45';mctx.fillRect(180,178,45,38);mctx.fillStyle='#fff';mctx.font='bold 13px Arial';mctx.fillText('ADNOC',181,172);const pos=walkingMode?player.position:car.position;const py=132-(pos.z-(walkingMode?player.position.z:car.position.z))*0.8;const px=132+(pos.x-(walkingMode?player.position.x:car.position.x))*1.3;mctx.fillStyle='#f4c45e';mctx.beginPath();mctx.arc(132,132,8,0,Math.PI*2);mctx.fill();mctx.strokeStyle='#fff';mctx.lineWidth=2;mctx.stroke()}

let last=performance.now(),lastRender=0,mapFrame=0;function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;if(now-lastRender<33)return;lastRender=now;updateLights(dt);trafficCars.forEach(t=>{t.group.position.z+=t.direction*t.speed*dt;if(t.group.position.z>2100)t.group.position.z=-100;if(t.group.position.z< -100)t.group.position.z=2100});npcs.filter(n=>n.walk).forEach(n=>{n.phase+=dt*.7;n.group.position.z=n.baseZ+Math.sin(n.phase)*5;n.group.rotation.y=Math.cos(n.phase)>0?0:Math.PI;animatePerson(n.group,dt,.5,false)});
if(!walkingMode){const gas=throttle||(keys.w||keys.arrowup?1:0),brake=braking||(keys.s||keys.arrowdown?1:0);let steer=steering;if(keys.a||keys.arrowleft)steer=-1;if(keys.d||keys.arrowright)steer=1;if(gas){if(speed<0)speed=Math.min(0,speed+15*dt);else speed+=8*dt}else if(brake){if(speed>0)speed=Math.max(0,speed-19*dt);else speed-=4.5*dt}else speed*=Math.pow(.988,dt*60);if(Math.abs(speed)>.1&&fuel>0){const oldFuel=Math.floor(fuel);fuel=Math.max(0,fuel-Math.abs(speed)*.000035*dt*60);if(Math.floor(fuel)!==oldFuel)updateFuel()}if(fuel<=0)speed=THREE.MathUtils.damp(speed,0,2,dt);speed=THREE.MathUtils.clamp(speed,-7,38);if(Math.abs(speed)>.08){const steerPower=THREE.MathUtils.lerp(1,.35,Math.min(Math.abs(speed)/38,1));heading-=steer*1.15*steerPower*dt*Math.sign(speed);const dx=Math.sin(heading)*speed*dt+Math.cos(heading)*lateral*dt,dz=Math.cos(heading)*speed*dt-Math.sin(heading)*lateral*dt;moveCarSafe(dx,dz)}lateral+=steer*speed*.025*dt*60;lateral*=Math.pow(.78,dt*60);car.rotation.y=heading;bodyPivot.rotation.x=THREE.MathUtils.damp(bodyPivot.rotation.x,gas&&speed>=0?-.035:brake&&speed>0?.06:0,5,dt);bodyPivot.rotation.z=THREE.MathUtils.damp(bodyPivot.rotation.z,-steer*Math.min(Math.abs(speed)/38,1)*.075,4,dt);bodyPivot.position.y=THREE.MathUtils.damp(bodyPivot.position.y,Math.sin(now*.012)*Math.min(Math.abs(speed)/38,.35)*.016,5,dt);const a=heading+cameraAngle;if(cameraMode===0){const desired=new THREE.Vector3(car.position.x-Math.sin(a)*cameraDistance,car.position.y+cameraHeight,car.position.z-Math.cos(a)*cameraDistance);camera.position.lerp(desired,1-Math.exp(-7*dt));camera.lookAt(car.position.x,car.position.y+1.1,car.position.z)}else{camera.position.lerp(new THREE.Vector3(car.position.x+Math.sin(heading)*.3,1.45,car.position.z+Math.cos(heading)*.3),1-Math.exp(-7*dt));camera.lookAt(car.position.x+Math.sin(heading)*12,1.5,car.position.z+Math.cos(heading)*12)}$('speed').textContent=Math.round(Math.abs(speed)*3.6);$('fuelBtn').style.display=stationDistance()<35?'block':'none';
}else if(chatBox.style.display!=='block'){let ix=steering,forward=-stickY;if(keys.w||keys.arrowup)forward=1;if(keys.s||keys.arrowdown)forward=-1;if(keys.a||keys.arrowleft)ix=-1;if(keys.d||keys.arrowright)ix=1;const len=Math.hypot(ix,forward);if(len>1){ix/=len;forward/=len}const moving=len>.08;playerTargetSpeed=moving?(running?6.2:2.2)*len:0;playerSpeed=THREE.MathUtils.damp(playerSpeed,playerTargetSpeed,moving?5:8,dt);if(moving){const mx=ix*Math.cos(playerHeading)+forward*Math.sin(playerHeading),mz=-ix*Math.sin(playerHeading)+forward*Math.cos(playerHeading),target=Math.atan2(mx,mz),diff=Math.atan2(Math.sin(target-playerHeading),Math.cos(target-playerHeading));playerHeading+=diff*(1-Math.exp(-9*dt));const nx=player.position.x+mx*playerSpeed*dt,nz=player.position.z+mz*playerSpeed*dt;if(!collidesAt(nx,nz)&&Math.abs(nx)<52){player.position.x=nx;player.position.z=nz}else playerSpeed=0;player.rotation.y=playerHeading}animatePerson(player,dt,playerSpeed/6.2,running);const dist=running?5.8:5.2;camera.position.lerp(new THREE.Vector3(player.position.x-Math.sin(playerHeading)*dist,running?3.4:3.1,player.position.z-Math.cos(playerHeading)*dist),1-Math.exp(-4.5*dt));camera.lookAt(player.position.x,1.25,player.position.z);nearbyNPC=null;let nearest=5;npcs.filter(n=>!n.walk).forEach(n=>{const d=player.position.distanceTo(n.group.position);if(d<nearest){nearest=d;nearbyNPC=n}});$('talkBtn').style.display=nearbyNPC?'block':'none'}else{playerSpeed=THREE.MathUtils.damp(playerSpeed,0,8,dt);animatePerson(player,dt,playerSpeed/6.2,running)}if(walkingMode){$('speed').textContent='0';$('fuelBtn').style.display='none'}checkMission();if(++mapFrame%3===0)drawMap();renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1))});updateMoney();updateFuel();
