<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CITY LIFE UAE</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  background: #a9cce5;
  font-family: Arial;
  touch-action: none;
}

canvas {
  display: block;
}

#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  z-index: 2;
  pointer-events: none;
}

.box {
  background: #101923dd;
  color: white;
  padding: 12px;
  border-radius: 12px;
}

#logo {
  color: #f4c45e;
  font-size: 17px;
  font-weight: bold;
}

#speed {
  font-size: 25px;
  font-weight: bold;
  text-align: center;
}

#cameraBtn {
  position: fixed;
  right: 12px;
  top: 105px;
  padding: 12px;
  border-radius: 12px;
  z-index: 3;
}

button {
  color: white;
  background: #172b43dd;
  border: 2px solid white;
  font-weight: bold;
  touch-action: none;
}

#controls {
  position: fixed;
  bottom: 20px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  align-items: end;
  z-index: 3;
}

#stick {
  width: 115px;
  height: 115px;
  border-radius: 50%;
  background: #ffffff35;
  border: 2px solid white;
  position: relative;
}

#knob {
  position: absolute;
  width: 48px;
  height: 48px;
  left: 31px;
  top: 31px;
  border-radius: 50%;
  background: white;
}

.pedals {
  display: flex;
  gap: 10px;
}

.pedal {
  width: 70px;
  height: 70px;
  border-radius: 50%;
}

#gas { background: #159b59; }
#brake { background: #bd3030; }

#status {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #101923ed;
  color: white;
  padding: 16px;
  border-radius: 12px;
  z-index: 5;
  text-align: center;
}
</style>
</head>

<body>

<div id="status">جاري تحميل السيارة...</div>

<div id="hud">
  <div class="box">
    <div id="logo">CITY LIFE UAE</div>
    <div>DUBAI</div>
  </div>

  <div class="box">
    <div id="speed">0</div>
    <div>KM/H</div>
  </div>
</div>

<button id="cameraBtn">📷 كاميرا خارجية</button>

<div id="controls">
  <div id="stick">
    <div id="knob"></div>
  </div>

  <div class="pedals">
    <button class="pedal" id="brake">فرامل</button>
    <button class="pedal" id="gas">بنزين</button>
  </div>
</div>

<script type="module">

import * as THREE from 'https://esm.sh/three@0.185.0';
import { GLTFLoader } from 'https://esm.sh/three@0.185.0/examples/jsm/loaders/GLTFLoader.js';

// المشهد
const scene = new THREE.Scene();

scene.background = new THREE.Color(0xa9cce5);
scene.fog = new THREE.Fog(0xa9cce5, 250, 1000);

// الكاميرا
const camera = new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  0.1,
  1500
);

// العرض
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

document.body.appendChild(renderer.domElement);

// الإضاءة
scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2));

const sunlight = new THREE.DirectionalLight(0xffffff, 3);
sunlight.position.set(-50, 100, 50);
sunlight.castShadow = true;
scene.add(sunlight);

// الأرضية فقط
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000),
  new THREE.MeshStandardMaterial({
    color: 0x777777,
    roughness: 1
  })
);

ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// السيارة
const car = new THREE.Group();
scene.add(car);

let carReady = false;

const loader = new GLTFLoader();

const carFiles = [
  './%D8%AC%D9%8A%20%D9%83%D9%84%D8%A7%D8%B3.glb',
  './جي%20كلاس.glb',
  './mercedes_benz_g-class_w263(1).glb',
  './gclass.glb'
];

function loadCar(index) {

  if (index >= carFiles.length) {
    document.getElementById('status').textContent =
      'تعذر تحميل السيارة. تأكد من اسم ملف GLB.';
    return;
  }

  loader.load(
    carFiles[index],

    gltf => {

      const model = gltf.scene;

      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      const maxSize = Math.max(size.x, size.y, size.z);
      const scale = 4.5 / maxSize;

      model.scale.setScalar(scale);

      model.position.x = -center.x * scale;
      model.position.y = -box.min.y * scale;
      model.position.z = -center.z * scale;

      model.traverse(object => {
        if (object.isMesh) {
          object.castShadow = true;
          object.receiveShadow = true;
        }
      });

      car.add(model);
      carReady = true;

      document.getElementById('status').style.display = 'none';

    },

    undefined,

    error => {
      loadCar(index + 1);
    }
  );
}

loadCar(0);

// حركة السيارة
let speed = 0;
let heading = 0;

let throttle = 0;
let braking = 0;
let steering = 0;

// الكاميرا
let cameraAngle = 0;
let cameraDistance = 9;
let cameraHeight = 3.5;

let dragging = false;
let lastX = 0;
let lastY = 0;

// تدوير الكاميرا باللمس
renderer.domElement.addEventListener('pointerdown', e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener('pointerup', () => {
  dragging = false;
});

window.addEventListener('pointermove', e => {

  if (!dragging) return;

  cameraAngle -= (e.clientX - lastX) * 0.006;

  cameraHeight = THREE.MathUtils.clamp(
    cameraHeight + (e.clientY - lastY) * 0.02,
    1.5,
    8
  );

  lastX = e.clientX;
  lastY = e.clientY;
});

// أزرار التحكم
function hold(id, callback) {

  const button = document.getElementById(id);

  button.addEventListener('pointerdown', e => {
    e.preventDefault();
    button.setPointerCapture(e.pointerId);
    callback(true);
  });

  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(event => {
    button.addEventListener(event, () => callback(false));
  });
}

hold('gas', value => throttle = value ? 1 : 0);
hold('brake', value => braking = value ? 1 : 0);

// عصا التوجيه
const stick = document.getElementById('stick');
const knob = document.getElementById('knob');

let stickId = null;

stick.addEventListener('pointerdown', e => {
  stickId = e.pointerId;
  stick.setPointerCapture(e.pointerId);
  moveStick(e);
});

stick.addEventListener('pointermove', e => {
  if (e.pointerId === stickId) moveStick(e);
});

function moveStick(e) {

  const rect = stick.getBoundingClientRect();

  let dx = e.clientX - (rect.left + rect.width / 2);
  let dy = e.clientY - (rect.top + rect.height / 2);

  const max = 38;
  const length = Math.hypot(dx, dy);

  if (length > max) {
    dx = dx / length * max;
    dy = dy / length * max;
  }

  steering = dx / max;

  knob.style.left = (31 + dx) + 'px';
  knob.style.top = (31 + dy) + 'px';
}

function resetStick() {
  stickId = null;
  steering = 0;
  knob.style.left = '31px';
  knob.style.top = '31px';
}

stick.addEventListener('pointerup', resetStick);
stick.addEventListener('pointercancel', resetStick);

// الكيبورد
const keys = {};

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// الكاميرا
let cameraMode = 0;

document.getElementById('cameraBtn').addEventListener('click', () => {

  cameraMode = 1 - cameraMode;

  document.getElementById('cameraBtn').textContent =
    cameraMode === 0
      ? '📷 كاميرا خارجية'
      : '📷 كاميرا داخلية';
});

// تشغيل اللعبة
let lastTime = performance.now();

function animate(now) {

  requestAnimationFrame(animate);

  const dt = Math.min((now - lastTime) / 1000, 0.04);
  lastTime = now;

  const gas = throttle || (keys.w || keys.arrowup ? 1 : 0);
  const brake = braking || (keys.s || keys.arrowdown ? 1 : 0);

  let steer = steering;

  if (keys.a || keys.arrowleft) steer = -1;
  if (keys.d || keys.arrowright) steer = 1;

  if (gas) {
    speed += 10 * dt;
  } else {
    speed *= Math.pow(0.99, dt * 60);
  }

  if (brake) {
    speed *= Math.pow(0.90, dt * 60);
  }

  speed = THREE.MathUtils.clamp(speed, -8, 35);

  if (Math.abs(speed) > 0.1) {

    heading -= steer * 1.1 * dt * Math.sign(speed);

    car.rotation.y = heading;

    car.position.x += Math.sin(heading) * speed * dt;
    car.position.z += Math.cos(heading) * speed * dt;
  }

  // الكاميرا الخارجية
  if (cameraMode === 0) {

    const angle = heading + cameraAngle;

    const target = new THREE.Vector3(
      car.position.x - Math.sin(angle) * cameraDistance,
      car.position.y + cameraHeight,
      car.position.z - Math.cos(angle) * cameraDistance
    );

    camera.position.lerp(target, 1 - Math.pow(0.001, dt));

    camera.lookAt(
      car.position.x,
      car.position.y + 1,
      car.position.z
    );

  } else {

    // منظور تقريبي من داخل السيارة
    const target = new THREE.Vector3(
      car.position.x + Math.sin(heading) * 0.3,
      car.position.y + 1.45,
      car.position.z + Math.cos(heading) * 0.3
    );

    camera.position.lerp(target, 1 - Math.pow(0.001, dt));

    camera.lookAt(
      car.position.x + Math.sin(heading) * 15,
      car.position.y + 1.5,
      car.position.z + Math.cos(heading) * 15
    );
  }

  document.getElementById('speed').textContent =
    Math.round(Math.abs(speed) * 3.6);

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

// حجم الشاشة
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>
</body>
</html>
