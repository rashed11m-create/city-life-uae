<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CITY LIFE UAE - DUBAI</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#9bc9e8;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:2}
.box{background:#101923dd;padding:11px 14px;border-radius:12px;color:white;font-size:13px}
#logo{font-size:18px;color:#f4c45e;font-weight:bold}
#speed{font-size:25px;font-weight:bold}
#controls{position:fixed;bottom:20px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;z-index:2}
#stick{width:120px;height:120px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff99;position:relative;touch-action:none}
#knob{position:absolute;width:50px;height:50px;left:33px;top:33px;border-radius:50%;background:white}
.pedals{display:flex;gap:10px}
button{width:72px;height:72px;border-radius:50%;border:2px solid white;color:white;font-weight:bold;background:#172b43dd;touch-action:none}
#gas{background:#159b59}
#brake{background:#bd3030}
#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#101923dd;color:white;padding:15px 20px;border-radius:12px;z-index:5}
</style>
</head>
<body>

<div id="status">جاري تجهيز المدينة...</div>

<div id="hud">
 <div class="box">
  <div id="logo">CITY LIFE UAE</div>
  <div>DOWNTOWN DUBAI</div>
  <div>💰 AED 5,000</div>
 </div>
 <div class="box" style="text-align:center">
  <div id="speed">0</div>
  <div>KM/H</div>
 </div>
</div>

<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <div class="pedals">
  <button id="brake">فرامل</button>
  <button id="gas">بنزين</button>
 </div>
</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.185.0';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc9e8);
scene.fog = new THREE.Fog(0x9bc9e8,180,650);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe5f3ff,0x6b6658,2));

const sun = new THREE.DirectionalLight(0xffedcf,3);
sun.position.set(-100,180,100);
sun.castShadow = true;
scene.add(sun);

function mat(color,roughness=.8,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

function box(w,h,d,color,x,y,z){
 const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 m.position.set(x,y,z);
 m.castShadow = true;
 m.receiveShadow = true;
 scene.add(m);
 return m;
}

// الأرض
const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(1200,1200),
 mat(0xb5aa91)
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// الشوارع
box(800,.12,42,0x292c31,0,.02,0);
box(42,.12,800,0x292c31,0,.03,0);

for(let i=-380;i<380;i+=13){
 box(5,.035,.22,0xe8dfc9,i,.1,0);
 box(.22,.035,5,0xe8dfc9,0,.1,i);
}

// المباني
const colors=[0xc5b9a7,0x9babb4,0xd4c8b5,0x777f86,0xb5a58e];

function building(x,z,w,d,h,color){
 const group = new THREE.Group();

 const body = new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  mat(color,.55)
 );
 body.position.y=h/2;
 body.castShadow=true;
 group.add(body);

 for(let r=0;r<Math.floor(h/3.5);r++){
  for(let c=0;c<Math.floor(w/2.5);c++){
   const win = new THREE.Mesh(
    new THREE.BoxGeometry(.85,1.3,.06),
    mat(0x8eb9c9,.25,.25)
   );
   win.position.set(-w/2+1.3+c*2.5,2+r*3.5,d/2+.04);
   group.add(win);
  }
 }

 group.position.set(x,0,z);
 scene.add(group);
}

for(let x=-160;x<=160;x+=38){
 for(let z=-160;z<=160;z+=38){
  if(Math.abs(x)<35||Math.abs(z)<35)continue;
  const h=20+Math.random()*95;
  building(x,z,18,18,h,colors[Math.floor(Math.random()*colors.length)]);
 }
}

// برج طويل مستوحى من أفق دبي
const tower = new THREE.Group();
let y=0;

for(const [w,d,h] of [[24,20,30],[19,16,40],[15,13,45],[11,10,40],[7,7,35],[4,4,30]]){
 const part = new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  mat(0xa8c6d5,.25,.3)
 );
 part.position.y=y+h/2;
 tower.add(part);
 y+=h;
}

const spire = new THREE.Mesh(
 new THREE.ConeGeometry(1.3,40,12),
 mat(0xc6d3d9,.3,.5)
);
spire.position.y=y+20;
tower.add(spire);
tower.position.set(80,0,-100);
scene.add(tower);

// نخيل
function palm(x,z){
 const trunk = new THREE.Mesh(
  new THREE.CylinderGeometry(.22,.4,5,8),
  mat(0x886044)
 );
 trunk.position.set(x,2.5,z);
 scene.add(trunk);

 for(let i=0;i<7;i++){
  const leaf = new THREE.Mesh(
   new THREE.BoxGeometry(.5,.15,4),
   mat(0x287344)
  );
  leaf.position.set(
   x+Math.sin(i*Math.PI/3.5)*1.4,
   5,
   z+Math.cos(i*Math.PI/3.5)*1.4
  );
  leaf.rotation.y=i*Math.PI/3.5;
  scene.add(leaf);
 }
}

for(let i=-130;i<140;i+=18){
 palm(i,27);
 palm(i,-27);
}

// سيارة مبدئية مصنوعة داخل اللعبة
const car = new THREE.Group();
scene.add(car);

const body = new THREE.Mesh(
 new THREE.BoxGeometry(2.2,.8,4.5),
 mat(0x111820,.3,.5)
);
body.position.y=.85;
car.add(body);

const cabin = new THREE.Mesh(
 new THREE.BoxGeometry(1.8,.85,2.2),
 mat(0x263e50,.2,.4)
);
cabin.position.set(0,1.55,-.2);
car.add(cabin);

const wheels=[];
for(const x of [-1.15,1.15]){
 for(const z of [-1.4,1.4]){
  const wheel = new THREE.Mesh(
   new THREE.CylinderGeometry(.42,.42,.3,20),
   mat(0x111111)
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,.48,z);
  car.add(wheel);
  wheels.push(wheel);
 }
}

car.position.set(0,0,8);

// التحكم
let throttle=0,braking=0,steering=0,speed=0,heading=0;

const stick=document.getElementById('stick');
const knob=document.getElementById('knob');
let stickId=null;

stick.addEventListener('pointerdown',e=>{
 stickId=e.pointerId;
 stick.setPointerCapture(e.pointerId);
 moveStick(e);
});

stick.addEventListener('pointermove',e=>{
 if(e.pointerId===stickId)moveStick(e);
});

function moveStick(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const max=40;
 const len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max;}
 steering=dx/max;
 knob.style.left=(33+dx)+'px';
 knob.style.top=(33+dy)+'px';
}

function resetStick(){
 stickId=null;
 steering=0;
 knob.style.left='33px';
 knob.style.top='33px';
}

stick.addEventListener('pointerup',resetStick);
stick.addEventListener('pointercancel',resetStick);

function hold(id,callback){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  callback(true);
 });
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{
  el.addEventListener(ev,()=>callback(false));
 });
}

hold('gas',v=>throttle=v?1:0);
hold('brake',v=>braking=v?1:0);

const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// الكاميرا
camera.position.set(0,7,-14);

let last=performance.now();

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);
 last=now;

 const gas=throttle||(keys.w||keys.arrowup?1:0);
 const brake=braking||(keys.s||keys.arrowdown?1:0);
 let steer=steering;

 if(keys.a||keys.arrowleft)steer=-1;
 if(keys.d||keys.arrowright)steer=1;

 if(gas)speed+=13*dt;
 else speed*=Math.pow(.988,dt*60);

 if(brake)speed*=Math.pow(.91,dt*60);

 speed=THREE.MathUtils.clamp(speed,-7,38);

 if(Math.abs(speed)>.15){
  heading-=steer*1.25*dt*Math.sign(speed);
  car.rotation.y=heading;
  car.position.x+=Math.sin(heading)*speed*dt;
  car.position.z+=Math.cos(heading)*speed*dt;
  wheels.forEach(w=>w.rotation.x+=speed*dt);
 }

 const target=new THREE.Vector3(
  car.position.x-Math.sin(heading)*12,
  car.position.y+6,
  car.position.z-Math.cos(heading)*12
 );

 camera.position.lerp(target,1-Math.pow(.001,dt));
 camera.lookAt(car.position.x,car.position.y+1.2,car.position.z);

 document.getElementById('speed').textContent=Math.round(Math.abs(speed)*3.6);

 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

document.getElementById('status').style.display='none';
</script>
</body>
</html>
