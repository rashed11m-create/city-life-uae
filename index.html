<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CITY LIFE UAE - DUBAI</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#9bc9e8;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:2}
.box{background:#101923dd;padding:11px 14px;border-radius:12px;color:white;font-size:13px}
#logo{font-size:18px;color:#f4c45e;font-weight:bold}
#speed{font-size:25px;font-weight:bold}
#controls{position:fixed;bottom:18px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;z-index:3}
#stick{width:115px;height:115px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff99;position:relative;touch-action:none}
#knob{position:absolute;width:48px;height:48px;left:31px;top:31px;border-radius:50%;background:white}
.pedals{display:flex;gap:9px}
button{border:2px solid white;color:white;font-weight:bold;background:#172b43dd;touch-action:none}
.pedal{width:70px;height:70px;border-radius:50%}
#gas{background:#159b59}
#brake{background:#bd3030}
#cameraBtn{position:fixed;right:14px;top:105px;padding:12px;border-radius:12px;z-index:4}
#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#101923ed;color:white;padding:16px 20px;border-radius:12px;z-index:5;text-align:center;line-height:1.7}
#help{position:fixed;bottom:145px;left:50%;transform:translateX(-50%);color:white;background:#101923aa;padding:7px 12px;border-radius:10px;font-size:12px;white-space:nowrap}
</style>
</head>
<body>

<div id="status">جاري تحميل المرسيدس...</div>

<div id="hud">
 <div class="box">
  <div id="logo">CITY LIFE UAE</div>
  <div>DUBAI</div>
  <div>💰 AED 5,000</div>
 </div>
 <div class="box" style="text-align:center">
  <div id="speed">0</div>
  <div>KM/H</div>
 </div>
</div>

<button id="cameraBtn">📷 الكاميرا: خارجية</button>

<div id="help">اسحب الشاشة لتدوير الكاميرا</div>

<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <div class="pedals">
  <button class="pedal" id="brake">فرامل</button>
  <button class="pedal" id="gas">بنزين</button>
 </div>
</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.185.0';
import {GLTFLoader} from 'https://esm.sh/three@0.185.0/examples/jsm/loaders/GLTFLoader.js';

const status=document.getElementById('status');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc9e8);
scene.fog=new THREE.Fog(0x9bc9e8,180,900);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1500);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));

const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(-80,150,80);
sun.castShadow=true;
scene.add(sun);

function mat(color,roughness=.8,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}

// أرضية
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(2000,2000),
 mat(0xb4a991)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.1;
scene.add(ground);

// طريق مبدئي
const road=new THREE.Mesh(
 new THREE.PlaneGeometry(500,32),
 mat(0x292d32)
);
road.rotation.x=-Math.PI/2;
road.position.y=.02;
scene.add(road);

const road2=road.clone();
road2.rotation.z=Math.PI/2;
scene.add(road2);

for(let i=-240;i<=240;i+=12){
 const line=new THREE.Mesh(
  new THREE.BoxGeometry(5,.035,.18),
  mat(0xffffff)
 );
 line.position.set(i,.1,0);
 scene.add(line);
}

// مباني مبدئية حول الطريق
for(let x=-180;x<=180;x+=35){
 for(let z of [-65,65]){
  const h=20+Math.random()*55;
  const b=new THREE.Mesh(
   new THREE.BoxGeometry(20,h,20),
   mat([0xb9b2a5,0x8999a5,0xd0c6b5][Math.floor(Math.random()*3)])
  );
  b.position.set(x,h/2,z);
  b.castShadow=true;
  scene.add(b);
 }
}

// السيارة
const car=new THREE.Group();
scene.add(car);

let carModel=null;
let carReady=false;

const loader=new GLTFLoader();

loader.load(
 './mercedes_benz_g-class_w263(1).glb',
 gltf=>{
  carModel=gltf.scene;

  const box=new THREE.Box3().setFromObject(carModel);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());

  // ضبط حجم السيارة ومركزها
  const maxLength=Math.max(size.x,size.y,size.z);
  const scale=4.3/maxLength;
  carModel.scale.setScalar(scale);

  carModel.position.x=-center.x*scale;
  carModel.position.y=-box.min.y*scale;
  carModel.position.z=-center.z*scale;

  carModel.traverse(obj=>{
   if(obj.isMesh){
    obj.castShadow=true;
    obj.receiveShadow=true;
   }
  });

  car.add(carModel);
  carReady=true;
  status.style.display='none';
 },
 undefined,
 error=>{
  console.error(error);
  status.innerHTML='تعذر تحميل السيارة.<br>تأكد من اسم ملف GLB ومكانه.';
 }
);

car.position.set(0,0,0);

// إعداد الكاميرا
let cameraMode=0;
let cameraAngle=0;
let cameraHeight=3.2;
let cameraDistance=8;
let dragging=false;
let lastX=0,lastY=0;

const cameraBtn=document.getElementById('cameraBtn');

cameraBtn.addEventListener('click',()=>{
 cameraMode=1-cameraMode;

 cameraBtn.textContent=cameraMode===0
  ?'📷 الكاميرا: خارجية'
  :'📷 الكاميرا: داخلية';
});

// تدوير الكاميرا بالسحب
renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;
 lastX=e.clientX;
 lastY=e.clientY;
});

window.addEventListener('pointerup',()=>dragging=false);

window.addEventListener('pointermove',e=>{
 if(!dragging||cameraMode===1)return;

 const dx=e.clientX-lastX;
 const dy=e.clientY-lastY;

 cameraAngle-=dx*.006;
 cameraHeight=THREE.MathUtils.clamp(cameraHeight+dy*.025,1.5,9);

 lastX=e.clientX;
 lastY=e.clientY;
});

// تقريب وإبعاد بالكاميرا
renderer.domElement.addEventListener('wheel',e=>{
 cameraDistance=THREE.MathUtils.clamp(cameraDistance+e.deltaY*.01,4,16);
});

// التحكم
let throttle=0,braking=0,steering=0;
let speed=0,heading=0;

const stick=document.getElementById('stick');
const knob=document.getElementById('knob');
let stickId=null;

stick.addEventListener('pointerdown',e=>{
 stickId=e.pointerId;
 stick.setPointerCapture(e.pointerId);
 moveStick(e);
});

stick.addEventListener('pointermove',e=>{
 if(e.pointerId===stickId)moveStick(e);
});

function moveStick(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const max=38;
 const len=Math.hypot(dx,dy);

 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }

 steering=dx/max;
 knob.style.left=(31+dx)+'px';
 knob.style.top=(31+dy)+'px';
}

function resetStick(){
 stickId=null;
 steering=0;
 knob.style.left='31px';
 knob.style.top='31px';
}

stick.addEventListener('pointerup',resetStick);
stick.addEventListener('pointercancel',resetStick);

function hold(id,callback){
 const el=document.getElementById(id);

 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  callback(true);
 });

 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{
  el.addEventListener(ev,()=>callback(false));
 });
}

hold('gas',v=>throttle=v?1:0);
hold('brake',v=>braking=v?1:0);

const keys={};

addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// تحديث اللعبة
let last=performance.now();

function animate(now){
 requestAnimationFrame(animate);

 const dt=Math.min((now-last)/1000,.04);
 last=now;

 const gas=throttle||(keys.w||keys.arrowup?1:0);
 const brake=braking||(keys.s||keys.arrowdown?1:0);

 let steer=steering;

 if(keys.a||keys.arrowleft)steer=-1;
 if(keys.d||keys.arrowright)steer=1;

 if(gas)speed+=10*dt;
 else speed*=Math.pow(.99,dt*60);

 if(brake)speed*=Math.pow(.90,dt*60);

 speed=THREE.MathUtils.clamp(speed,-8,35);

 if(Math.abs(speed)>.1){
  heading-=steer*1.1*dt*Math.sign(speed);

  car.rotation.y=heading;

  car.position.x+=Math.sin(heading)*speed*dt;
  car.position.z+=Math.cos(heading)*speed*dt;
 }

 if(cameraMode===0){
  const angle=heading+cameraAngle;

  const desired=new THREE.Vector3(
   car.position.x-Math.sin(angle)*cameraDistance,
   car.position.y+cameraHeight,
   car.position.z-Math.cos(angle)*cameraDistance
  );

  camera.position.lerp(desired,1-Math.pow(.001,dt));
  camera.lookAt(car.position.x,car.position.y+1.1,car.position.z);

 }else{
  // كاميرا تقريبية من موضع السائق
  const front=new THREE.Vector3(
   car.position.x+Math.sin(heading)*.3,
   car.position.y+1.45,
   car.position.z+Math.cos(heading)*.3
  );

  camera.position.lerp(front,1-Math.pow(.001,dt));

  const look=new THREE.Vector3(
   car.position.x+Math.sin(heading)*12,
   car.position.y+1.5,
   car.position.z+Math.cos(heading)*12
  );

  camera.lookAt(look);
 }

 document.getElementById('speed').textContent=
  Math.round(Math.abs(speed)*3.6);

 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
