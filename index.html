<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CITY LIFE UAE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bc9e8;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2;pointer-events:none}
.box{background:#101923dd;padding:11px 14px;border-radius:12px;color:white;font-size:13px}
#logo{font-size:18px;color:#f4c45e;font-weight:bold}
#speed{font-size:25px;font-weight:bold}
#controls{position:fixed;bottom:18px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;z-index:3}
#stick{width:115px;height:115px;border-radius:50%;background:#ffffff35;border:2px solid #ffffff99;position:relative;touch-action:none}
#knob{position:absolute;width:48px;height:48px;left:31px;top:31px;border-radius:50%;background:white}
.pedals{display:flex;gap:9px}
button{border:2px solid white;color:white;font-weight:bold;background:#172b43dd;touch-action:none}
.pedal{width:70px;height:70px;border-radius:50%}
#gas{background:#159b59}
#brake{background:#bd3030}
#cameraBtn{position:fixed;right:14px;top:105px;padding:12px;border-radius:12px;z-index:4}
#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#101923ed;color:white;padding:16px 20px;border-radius:12px;z-index:5;text-align:center;line-height:1.7;max-width:85%}
#help{position:fixed;bottom:145px;left:50%;transform:translateX(-50%);color:white;background:#101923aa;padding:7px 12px;border-radius:10px;font-size:12px;white-space:nowrap}
</style>
</head>
<body>

<div id="status">جاري تحميل المرسيدس...</div>

<div id="hud">
  <div class="box">
    <div id="logo">CITY LIFE UAE</div>
    <div>تجربة القيادة</div>
    <div>💰 AED 5,000</div>
  </div>
  <div class="box" style="text-align:center">
    <div id="speed">0</div>
    <div>KM/H</div>
  </div>
</div>

<button id="cameraBtn">📷 الكاميرا: خارجية</button>
<div id="help">اسحب الشاشة لتدوير الكاميرا</div>

<div id="controls">
  <div id="stick"><div id="knob"></div></div>
  <div class="pedals">
    <button class="pedal" id="brake">فرامل<br>رجوع</button>
    <button class="pedal" id="gas">بنزين</button>
  </div>
</div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.185.0';
import {GLTFLoader} from 'https://esm.sh/three@0.185.0/examples/jsm/loaders/GLTFLoader.js';

const status=document.getElementById('status');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc9e8);
scene.fog=new THREE.Fog(0x9bc9e8,180,900);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1500);

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:'high-performance'
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1;
document.body.appendChild(renderer.domElement);

// الإضاءة
scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));

const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(-80,150,80);
sun.castShadow=true;
scene.add(sun);

// الأرض
const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(2000,2000),
  new THREE.MeshStandardMaterial({color:0x777b7e,roughness:1})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.08;
ground.receiveShadow=true;
scene.add(ground);

// ==========================
// إنشاء الشارع
// ==========================

const roadGroup=new THREE.Group();
scene.add(roadGroup);

function roadBox(w,h,d,x,y,z,color,roughness=0.9){
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color,roughness})
  );
  mesh.position.set(x,y,z);
  mesh.receiveShadow=true;
  mesh.castShadow=true;
  roadGroup.add(mesh);
  return mesh;
}

// الإسفلت
roadBox(14,.12,10000,0,0,0,0x292d32);

// الأكتاف الجانبية
roadBox(.25,.13,10000,-7.05,.02,0,0x55585b);
roadBox(.25,.13,10000,7.05,.02,0,0x55585b);

// خطوط حدود المسارات
roadBox(.13,.025,10000,-6.25,.09,0,0xffffff);
roadBox(.13,.025,10000,6.25,.09,0,0xffffff);

// الخط المتقطع في المنتصف
for(let z=-5000;z<5000;z+=12){
  roadBox(.16,.035,5,0,.095,z,0xf5f5f5);
}

// الأرصفة
roadBox(3,.28,10000,-8.8,.08,0,0xb9b9b9);
roadBox(3,.28,10000,8.8,.08,0,0xb9b9b9);

// حواف الأرصفة
roadBox(.18,.35,10000,-10.25,.12,0,0x777777);
roadBox(.18,.35,10000,10.25,.12,0,0x777777);

// فواصل الرصيف
for(let z=-5000;z<5000;z+=4){
  roadBox(2.8,.025,.08,-8.8,.235,z,0x999999);
  roadBox(2.8,.025,.08,8.8,.235,z,0x999999);
}

// ==========================
// أعمدة الإنارة
// ==========================

function createLamp(x,z){
  const pole=new THREE.Mesh(
    new THREE.CylinderGeometry(.075,.11,6,10),
    new THREE.MeshStandardMaterial({color:0x555b60,metalness:.65,roughness:.4})
  );
  pole.position.set(x,3,z);
  pole.castShadow=true;
  roadGroup.add(pole);

  const arm=new THREE.Mesh(
    new THREE.BoxGeometry(1.5,.09,.1),
    new THREE.MeshStandardMaterial({color:0x555b60,metalness:.5})
  );
  arm.position.set(x+(x<0?-.65:.65),5.8,z);
  roadGroup.add(arm);

  const lamp=new THREE.Mesh(
    new THREE.BoxGeometry(.55,.16,.35),
    new THREE.MeshStandardMaterial({
      color:0xfff1c4,
      emissive:0xffd987,
      emissiveIntensity:1.2
    })
  );
  lamp.position.set(x+(x<0?-1.25:1.25),5.7,z);
  roadGroup.add(lamp);
}

for(let z=-4900;z<=4900;z+=45){
  createLamp(-10.8,z);
  createLamp(10.8,z);
}

// ==========================
// السيارة
// ==========================

const car=new THREE.Group();
scene.add(car);

const bodyPivot=new THREE.Group();
car.add(bodyPivot);

const loader=new GLTFLoader();

loader.load(
  './%D8%AC%D9%8A%20%D9%83%D9%84%D8%A7%D8%B3.glb',

  gltf=>{
    const model=gltf.scene;

    const box=new THREE.Box3().setFromObject(model);
    const size=box.getSize(new THREE.Vector3());
    const center=box.getCenter(new THREE.Vector3());

    const scale=4.3/Math.max(size.x,size.y,size.z);
    model.scale.setScalar(scale);

    model.position.set(
      -center.x*scale,
      -box.min.y*scale,
      -center.z*scale
    );

    model.traverse(o=>{
      if(o.isMesh){
        o.castShadow=true;
        o.receiveShadow=true;
      }
    });

    bodyPivot.add(model);
    status.style.display='none';
  },

  undefined,

  error=>{
    console.error(error);
    status.innerHTML='تعذر تحميل السيارة. تأكد من وجود ملف جي كلاس.glb بجانب index.html.';
  }
);

// ==========================
// الكاميرا
// ==========================

let cameraMode=0;
let cameraAngle=0;
let cameraHeight=3.2;
let cameraDistance=8;

let dragging=false;
let lastX=0;
let lastY=0;

const cameraBtn=document.getElementById('cameraBtn');

cameraBtn.addEventListener('click',()=>{
  cameraMode=1-cameraMode;
  cameraBtn.textContent=cameraMode===0
    ?'📷 الكاميرا: خارجية'
    :'📷 الكاميرا: داخلية';
});

renderer.domElement.addEventListener('pointerdown',e=>{
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
});

window.addEventListener('pointerup',()=>dragging=false);

window.addEventListener('pointermove',e=>{
  if(!dragging||cameraMode===1)return;

  cameraAngle-=(e.clientX-lastX)*.006;

  cameraHeight=THREE.MathUtils.clamp(
    cameraHeight+(e.clientY-lastY)*.025,
    1.5,9
  );

  lastX=e.clientX;
  lastY=e.clientY;
});

// ==========================
// التحكم
// ==========================

let throttle=0;
let braking=0;
let steering=0;
let speed=0;
let heading=0;
let lateral=0;

const stick=document.getElementById('stick');
const knob=document.getElementById('knob');

let stickId=null;

stick.addEventListener('pointerdown',e=>{
  stickId=e.pointerId;
  stick.setPointerCapture(e.pointerId);
  moveStick(e);
});

stick.addEventListener('pointermove',e=>{
  if(e.pointerId===stickId)moveStick(e);
});

function moveStick(e){
  const r=stick.getBoundingClientRect();

  let dx=e.clientX-(r.left+r.width/2);
  let dy=e.clientY-(r.top+r.height/2);

  const max=38;
  const len=Math.hypot(dx,dy);

  if(len>max){
    dx=dx/len*max;
    dy=dy/len*max;
  }

  steering=dx/max;
  knob.style.left=(31+dx)+'px';
  knob.style.top=(31+dy)+'px';
}

function resetStick(){
  stickId=null;
  steering=0;
  knob.style.left='31px';
  knob.style.top='31px';
}

stick.addEventListener('pointerup',resetStick);
stick.addEventListener('pointercancel',resetStick);

function hold(id,cb){
  const el=document.getElementById(id);

  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    cb(true);
  });

  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{
    el.addEventListener(ev,()=>cb(false));
  });
}

hold('gas',v=>throttle=v?1:0);
hold('brake',v=>braking=v?1:0);

const keys={};

addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// ==========================
// القيادة والتعليق
// ==========================

let last=performance.now();

function animate(now){
  requestAnimationFrame(animate);

  const dt=Math.min((now-last)/1000,.04);
  last=now;

  const gas=throttle||(keys.w||keys.arrowup?1:0);
  const brake=braking||(keys.s||keys.arrowdown?1:0);

  let steer=steering;
  if(keys.a||keys.arrowleft)steer=-1;
  if(keys.d||keys.arrowright)steer=1;

  if(gas){
    if(speed<0)speed=Math.min(0,speed+13*dt);
    else speed+=7.5*dt;
  }else if(brake){
    if(speed>0)speed=Math.max(0,speed-16*dt);
    else speed-=3.8*dt;
  }else{
    speed*=Math.pow(.985,dt*60);
  }

  speed=THREE.MathUtils.clamp(speed,-7,32);

  if(Math.abs(speed)>.08){
    const steerPower=THREE.MathUtils.lerp(
      1,.38,Math.min(Math.abs(speed)/32,1)
    );

    heading-=steer*1.05*steerPower*dt*Math.sign(speed);

    car.position.x+=
      Math.sin(heading)*speed*dt+
      Math.cos(heading)*lateral*dt;

    car.position.z+=
      Math.cos(heading)*speed*dt-
      Math.sin(heading)*lateral*dt;
  }

  lateral+=steer*speed*.035*dt*60;
  lateral*=Math.pow(.82,dt*60);

  car.rotation.y=heading;

  // التعليق المرئي
  const targetPitch=gas&&speed>=0?-.025:brake&&speed>0?.045:0;
  const targetRoll=-steer*Math.min(Math.abs(speed)/32,1)*.055;
  const bob=Math.sin(now*.012)*Math.min(Math.abs(speed)/32,.35)*.012;

  bodyPivot.rotation.x=THREE.MathUtils.damp(
    bodyPivot.rotation.x,targetPitch,5,dt
  );

  bodyPivot.rotation.z=THREE.MathUtils.damp(
    bodyPivot.rotation.z,targetRoll,4,dt
  );

  bodyPivot.position.y=THREE.MathUtils.damp(
    bodyPivot.position.y,bob,5,dt
  );

  // الكاميرا الخارجية
  if(cameraMode===0){
    const angle=heading+cameraAngle;

    const desired=new THREE.Vector3(
      car.position.x-Math.sin(angle)*cameraDistance,
      car.position.y+cameraHeight,
      car.position.z-Math.cos(angle)*cameraDistance
    );

    camera.position.lerp(desired,1-Math.pow(.001,dt));

    camera.lookAt(
      car.position.x,
      car.position.y+1.1,
      car.position.z
    );
  }else{
    const front=new THREE.Vector3(
      car.position.x+Math.sin(heading)*.3,
      car.position.y+1.45,
      car.position.z+Math.cos(heading)*.3
    );

    camera.position.lerp(front,1-Math.pow(.001,dt));

    camera.lookAt(
      car.position.x+Math.sin(heading)*12,
      car.position.y+1.5,
      car.position.z+Math.cos(heading)*12
    );
  }

  document.getElementById('speed').textContent=
    Math.round(Math.abs(speed)*3.6);

  renderer.render(scene,camera);
}

requestAnimationFrame(animate);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
